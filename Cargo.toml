[package]
name = "restic-backup-app"
version = "0.3.26"
edition = "2024"
description = "restic-Backup auf NAS (SMB) mit Zeitplan, Restore und Retention"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
# OpenGL (glow) statt wgpu: schnellerer Start, weniger Speicher, kleinere Datei; die Oberfläche braucht kein Vulkan
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "wayland", "web_screen_reader", "glow", "x11"] }
keyring = "4.2.0"
notify-rust = "4.18.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
tray-icon = "0.26.1"
ureq = "3.5.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.deb]
maintainer = "Cyberhuter"
depends = "$auto, restic, cifs-utils, policykit-1"
section = "utils"
priority = "optional"
extended-description = "Sichert Ordner per restic auf eine SMB-Freigabe (NAS), mit Zeitplan, Wiederherstellung und Aufbewahrungsregeln."
assets = [
    ["target/release/restic-backup-app", "usr/bin/", "755"],
    ["packaging/linux/restic-backup-app.desktop", "usr/share/applications/", "644"],
    ["packaging/icon.png", "usr/share/icons/hicolor/256x256/apps/restic-backup-app.png", "644"],
]
