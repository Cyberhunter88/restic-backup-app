name: release

# Manuell starten: Actions → release → "Run workflow" (Branch: main), Versionsnummer eingeben.
# Ablauf: Version und Changelog auf einem Release-Branch anpassen → Release-PR öffnen und bauen.
# Nach dem Mergen des PR (main ist geschützt) baut build.yml main und legt Tag + GitHub-Release an.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Neue Version ohne v, z. B. 0.3.1"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency: release

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      branch: ${{ steps.v.outputs.branch }}
    steps:
      - name: Nur von main aus
        run: |
          if [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]; then
            echo "Bitte den Workflow auf dem Branch ${{ github.event.repository.default_branch }} starten (aktuell: $GITHUB_REF_NAME)."; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Version prüfen
        id: v
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Ungültige Version '$VERSION' (erwartet X.Y.Z)"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then echo "Tag v$VERSION existiert bereits"; exit 1; fi
          OLD=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [ "$(printf '%s\n%s\n' "$OLD" "$VERSION" | sort -V | tail -1)" != "$VERSION" ] || [ "$OLD" = "$VERSION" ]; then echo "Version $VERSION muss größer sein als die aktuelle $OLD"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=release/v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Version und Changelog anpassen
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace
          python3 - <<'PY'
          import os
          v = os.environ["VERSION"]
          s = open("CHANGELOG.md", encoding="utf-8").read()
          if "## [Unveröffentlicht]" in s:
              s = s.replace("## [Unveröffentlicht]", f"## [{v}]", 1)
          else:
              s = s.replace("# Changelog\n", f"# Changelog\n\n## [{v}]\n\n- Release {v}\n", 1)
          open("CHANGELOG.md", "w", encoding="utf-8").write(s)
          PY
          git diff --stat
      - name: Release-Branch pushen
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git push origin "HEAD:refs/heads/release/v$VERSION"

  pull-request:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release-PR öffnen und Build starten
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          gh pr create --base main --head "$BRANCH" --title "Release v$VERSION" \
            --body "Setzt Version und Changelog auf $VERSION. Nach dem Mergen baut der main-Build und veröffentlicht v$VERSION automatisch."
          # PRs, die mit dem Workflow-Token angelegt werden, starten keine Workflows – deshalb den Build von Hand anstoßen,
          # damit der PR die Pflichtprüfung „Anwendung prüfen“ bekommt
          gh workflow run build.yml --ref "$BRANCH"
