name: release

# Manuell starten: Actions → release → "Run workflow" (Branch: main), Versionsnummer eingeben.
# Ablauf: Version hochsetzen → Release-Branch bauen und testen → main vorspulen → Tag + GitHub-Release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Neue Version ohne v, z. B. 0.3.1"
        required: true
        type: string

permissions:
  contents: write

concurrency: release

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      branch: ${{ steps.v.outputs.branch }}
    steps:
      - name: Nur von main aus
        run: |
          if [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]; then
            echo "Bitte den Workflow auf dem Branch ${{ github.event.repository.default_branch }} starten (aktuell: $GITHUB_REF_NAME)."; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Version prüfen
        id: v
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Ungültige Version '$VERSION' (erwartet X.Y.Z)"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then echo "Tag v$VERSION existiert bereits"; exit 1; fi
          OLD=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [ "$(printf '%s\n%s\n' "$OLD" "$VERSION" | sort -V | tail -1)" != "$VERSION" ] || [ "$OLD" = "$VERSION" ]; then echo "Version $VERSION muss größer sein als die aktuelle $OLD"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=release/v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Version und Changelog anpassen
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace
          python3 - <<'PY'
          import os
          v = os.environ["VERSION"]
          s = open("CHANGELOG.md", encoding="utf-8").read()
          if "## [Unveröffentlicht]" in s:
              s = s.replace("## [Unveröffentlicht]", f"## [{v}]", 1)
          else:
              s = s.replace("# Changelog\n", f"# Changelog\n\n## [{v}]\n\n- Release {v}\n", 1)
          open("CHANGELOG.md", "w", encoding="utf-8").write(s)
          PY
          git diff --stat
      - name: Release-Branch pushen
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git push origin "HEAD:refs/heads/release/v$VERSION"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.branch }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.branch }}
          fetch-depth: 0
          # Optional: Secret RELEASE_TOKEN (PAT), falls main später geschützt wird
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: main vorspulen (nur wenn main seit dem Start unverändert ist)
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: git push origin "HEAD:refs/heads/$DEFAULT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub-Release mit Tag erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release create "v$VERSION" dist/* --target "$(git rev-parse HEAD)" --title "v$VERSION" --generate-notes

  cleanup:
    needs: [prepare, build, publish]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Release-Branch löschen
        run: git push origin --delete "${{ needs.prepare.outputs.branch }}" || true
