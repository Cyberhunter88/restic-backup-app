name: release

# Manuell starten: Actions → release → "Run workflow" (Branch: main), ohne Eingaben.
# Die Version ist die `version` aus der Cargo.toml des aktuellen main-Stands (im PR erhöht).
# Der Workflow ändert nichts an main und legt keinen PR an. Er prüft die
# erfolgreiche Build-Prüfung genau dieses Commits, nimmt die dort gebauten Pakete (kein Neubau),
# legt ein Release als Entwurf an, hängt die Dateien an und veröffentlicht erst danach.
# Wiederholung mit derselben Version und demselben Commit ist unschädlich.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version und Build prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
      run_id: ${{ steps.check.outputs.run_id }}
      already: ${{ steps.check.outputs.already }}
    steps:
      - name: Nur manuell auf main ausführen
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Release nur über „Run workflow“ mit Branch main starten."; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; echo "## Release abgebrochen: $1 Es wurde nichts veröffentlicht." >> "$GITHUB_STEP_SUMMARY"; exit 1; }

          COMMIT=$(git rev-parse origin/main)
          VERSION=$(git show "$COMMIT:Cargo.toml" | grep -m1 '^version' | sed 's/.*"\(.*\)"//')
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail "Ungültige Version „$VERSION“ in Cargo.toml (erwartet X.Y.Z)."

          # Schon veröffentlicht? Gleiche Version + gleicher Commit = nichts zu tun, anderer Commit = Fehler
          TAG_COMMIT=$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}" || true)
          ALREADY=false
          if [ -n "$TAG_COMMIT" ]; then
            [ "$TAG_COMMIT" = "$COMMIT" ] || fail "Tag v$VERSION zeigt auf $TAG_COMMIT, nicht auf $COMMIT."
            DRAFT=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
            if [ "$DRAFT" = false ]; then ALREADY=true; fi
          fi

          # Erfolgreiche Build-Prüfung für genau diesen Commit auf main (Push oder manueller Lauf)
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --commit "$COMMIT" --branch main --status success \
            --json databaseId,event --limit 30 --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].databaseId // empty')
          if [ -z "$RUN_ID" ] && [ "$ALREADY" != true ]; then
            fail "Für $COMMIT gibt es keinen erfolgreichen Build auf main (reine Doku-Änderungen lösen keinen aus: dann Actions → build → Run workflow auf main starten)."
          fi

          {
            echo "version=$VERSION"
            echo "commit=$COMMIT"
            echo "run_id=$RUN_ID"
            echo "already=$ALREADY"
          } >> "$GITHUB_OUTPUT"
          if [ "$ALREADY" = true ]; then
            echo "## v$VERSION ist für $COMMIT schon veröffentlicht – nichts zu tun." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Prüfung bestanden: v$VERSION, Commit $COMMIT, Build-Lauf $RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Release veröffentlichen
    needs: prepare
    if: needs.prepare.outputs.already != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      RUN_ID: ${{ needs.prepare.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Gebaute Pakete aus dem geprüften Build holen
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'restic-backup-app-*' --dir "$RUNNER_TEMP/dl"
          mkdir dist
          find "$RUNNER_TEMP/dl" -type f -exec cp {} dist/ \;
          for f in "restic-backup-app-$VERSION-x86_64.AppImage" "restic-backup-app-setup-$VERSION.exe" \
                   "restic-backup-app_$VERSION-1_amd64.deb" "restic-backup-app-windows-x86_64.exe"; do
            [ -s "dist/$f" ] || { echo "::error::Paket $f fehlt im Build $RUN_ID (anderer Versionsstand?)."; exit 1; }
          done
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          ls -l dist
      - name: Release-Text aus dem Changelog
        run: |
          # Text aus dem Changelog, falls es einen Abschnitt zur Version gibt (kein Muss)
          git show "$COMMIT:CHANGELOG.md" 2>/dev/null | awk -v h="## [$VERSION]" '$0 == h {on=1; next} /^## \[/ {on=0} on' | sed '/./,$!d' > "$RUNNER_TEMP/notes.md" || true
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then echo "Release $VERSION" > "$RUNNER_TEMP/notes.md"; fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Entwurf anlegen, Dateien anhängen, prüfen
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$COMMIT" --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" --latest=false
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/* --clobber
          n=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          [ "$n" -eq "$(ls dist | wc -l)" ] || { echo "::error::Es sind $n statt $(ls dist | wc -l) Dateien am Release."; exit 1; }
      - name: Veröffentlichen
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          # „Neueste“ wird nur verschoben, wenn diese Version die höchste veröffentlichte ist
          highest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$highest" ] || [ "$(printf '%s\n%s\n' "$highest" "$VERSION" | sort -V | tail -1)" = "$VERSION" ]; then latest=true; else latest=false; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
          echo "## Veröffentlicht: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
