name: build

# Ein Build pro Änderung:
# - Feature-Branches bauen nur über ihren Pull Request (kein zusätzlicher Push-Build)
# - Pull Requests werden immer gebaut (auch reine Doku-Änderungen), weil main die Prüfung
#   „Anwendung prüfen“ verlangt
# - main wird nach dem Merge einmal gebaut; trägt der Commit eine noch nicht veröffentlichte
#   Version aus Cargo.toml (im PR erhöht), legt der Job „release“ Tag und GitHub-Release an
# - reine Doku-Änderungen auf main lösen keinen Build aus
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", ".githooks/**"]
  pull_request:
  # Manuell startbar (Actions → build → Run workflow)
  workflow_dispatch:

permissions:
  contents: write

# Neuere Läufe derselben Änderung ersetzen ältere (nicht bei Tags)
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version aus Cargo.toml
        id: ver
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zur Cargo-Version $v"; exit 1
          fi

      # ---------- Linux ----------
      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y restic libdbus-1-dev pkg-config libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Linux – cargo-deb und linuxdeploy
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          sudo apt-get install -y libfuse2
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy

      # ---------- Windows ----------
      - name: Windows – restic und Inno Setup installieren
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install restic innosetup -y
          # Echtes restic.exe laden (der choco-Shim zeigt auf einen Pfad, den es beim Nutzer nicht gibt)
          gh release download --repo restic/restic --pattern '*_windows_amd64.zip' --dir restic-dl
          Expand-Archive restic-dl\*.zip -DestinationPath restic-dl\x
          Copy-Item (Get-ChildItem restic-dl\x -Filter *.exe | Select-Object -First 1).FullName packaging\windows\restic.exe
          if ((Get-Item packaging\windows\restic.exe).Length -lt 5MB) { throw "restic.exe zu klein - Shim statt Binary?" }
          & packaging\windows\restic.exe version
        env:
          GH_TOKEN: ${{ github.token }}

      - run: cargo test --release
      - run: cargo build --release

      - name: Linux – .deb und AppImage
        if: runner.os == 'Linux'
        run: |
          cargo deb --no-build
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp packaging/icon.png restic-backup-app.png
          ARCH=x86_64 ./linuxdeploy --appdir AppDir \
            -e target/release/restic-backup-app \
            -d packaging/linux/restic-backup-app.desktop \
            -i restic-backup-app.png --output appimage
          mv restic*.AppImage dist/restic-backup-app-${{ steps.ver.outputs.version }}-x86_64.AppImage

      - name: Windows – Setup bauen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\windows\setup.iss
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\installer\*.exe dist\
          Copy-Item target\release\restic-backup-app.exe dist\restic-backup-app-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: restic-backup-app-${{ matrix.target }}
          path: dist/*

  # Stabiler Name: main verlangt genau diese Prüfung (wie bei den anderen Projekten)
  pruefen:
    name: Anwendung prüfen
    if: always()
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Alle Builds verlangen
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "Build (Linux und Windows): $BUILD_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$BUILD_RESULT" = success

  release:
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Von Hand gesetzter Tag
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          generate_release_notes: true
      # Merge eines PR mit erhöhter Version: Version aus Cargo.toml veröffentlichen, falls es den Tag noch nicht gibt
      - name: Release für neue Version anlegen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if gh release view "v$v" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null 2>&1; then
            echo "v$v ist schon veröffentlicht – nichts zu tun."
          else
            gh release create "v$v" dist/* --target "$GITHUB_SHA" --title "v$v" --generate-notes
          fi
