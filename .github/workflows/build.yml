name: build

# Ein Build pro Änderung:
# - Feature-Branches bauen nur über ihren Pull Request (kein zusätzlicher Push-Build)
# - master wird nach dem Merge einmal geprüft; Release-Commits ("Release v…") werden nicht
#   noch einmal gebaut, da der Release-Workflow sie schon gebaut hat
# - reine Doku-Änderungen lösen keinen Build aus
on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore: ["**.md", ".githooks/**"]
  pull_request:
    paths-ignore: ["**.md", ".githooks/**"]
  workflow_dispatch:
  # Wird vom Release-Workflow aufgerufen (Build eines Release-Branches)
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: write

# Neuere Läufe derselben Änderung ersetzen ältere (nicht bei Tags und nicht beim Release-Aufruf)
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  build:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || !startsWith(github.event.head_commit.message, 'Release v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version aus Cargo.toml
        id: ver
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zur Cargo-Version $v"; exit 1
          fi

      # ---------- Linux ----------
      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y restic libdbus-1-dev pkg-config libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Linux – cargo-deb und linuxdeploy
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          sudo apt-get install -y libfuse2
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy

      # ---------- Windows ----------
      - name: Windows – restic und Inno Setup installieren
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install restic innosetup -y
          # Echtes restic.exe laden (der choco-Shim zeigt auf einen Pfad, den es beim Nutzer nicht gibt)
          gh release download --repo restic/restic --pattern '*_windows_amd64.zip' --dir restic-dl
          Expand-Archive restic-dl\*.zip -DestinationPath restic-dl\x
          Copy-Item (Get-ChildItem restic-dl\x -Filter *.exe | Select-Object -First 1).FullName packaging\windows\restic.exe
          if ((Get-Item packaging\windows\restic.exe).Length -lt 5MB) { throw "restic.exe zu klein - Shim statt Binary?" }
          & packaging\windows\restic.exe version
        env:
          GH_TOKEN: ${{ github.token }}

      - run: cargo test --release
      - run: cargo build --release

      - name: Linux – .deb und AppImage
        if: runner.os == 'Linux'
        run: |
          cargo deb --no-build
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp packaging/icon.png restic-backup-app.png
          ARCH=x86_64 ./linuxdeploy --appdir AppDir \
            -e target/release/restic-backup-app \
            -d packaging/linux/restic-backup-app.desktop \
            -i restic-backup-app.png --output appimage
          mv restic*.AppImage dist/restic-backup-app-${{ steps.ver.outputs.version }}-x86_64.AppImage

      - name: Windows – Setup bauen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\windows\setup.iss
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\installer\*.exe dist\
          Copy-Item target\release\restic-backup-app.exe dist\restic-backup-app-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: restic-backup-app-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
