name: build

# Ein Build pro Änderung:
# - Feature-Branches bauen nur über ihren Pull Request (kein zusätzlicher Push-Build)
# - Pull Requests werden immer gebaut (auch reine Doku-Änderungen), weil main die Prüfung
#   „Anwendung prüfen“ verlangt
# - main wird nach dem Merge einmal gebaut; die Pakete bleiben 90 Tage als Artefakte erhalten
#   und werden vom Workflow „release“ unverändert veröffentlicht (kein Neubau, kein Release hier)
# Actions-Speicher sparen:
# - Pakete aus Pull Requests bleiben nur 3 Tage (nur zum Ausprobieren, der Release nutzt sie nie)
# - nach einem erfolgreichen main-Build werden die Pakete älterer main-Builds gelöscht
#   (der Release-Workflow nimmt ohnehin nur den Build des aktuellen main-Commits)
# - den Rust-Cache speichert nur main; Pull Requests lesen ihn nur
# - reine Doku-Änderungen auf main lösen keinen Build aus
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".githooks/**"]
  pull_request:
  # Manuell startbar (z. B. für einen main-Commit ohne Build, den der Release-Workflow braucht)
  workflow_dispatch:

# Der Build veröffentlicht nichts (das macht `release.yml`): Lesen reicht
permissions:
  contents: read

# Neuere Läufe derselben Änderung ersetzen ältere
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Nur main legt Caches an (Pull Requests nutzen sie mit), sonst speichert jeder PR
          # eigene Kopien von target/ für Linux und Windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Version aus Cargo.toml
        id: ver
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # ---------- Linux ----------
      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y restic libdbus-1-dev pkg-config libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Linux – cargo-deb und linuxdeploy
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          sudo apt-get install -y libfuse2
          # GitHub liefert Release-Downloads gelegentlich mit 504 aus: mehrfach versuchen
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          # AppImage-Runtime selbst laden (das Plugin lädt sie sonst ohne Wiederholung und scheitert bei 504)
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64             && echo "LDAI_RUNTIME_FILE=$PWD/runtime-x86_64" >> "$GITHUB_ENV"             || echo "::warning::Runtime nicht ladbar, das Plugin versucht es selbst"

      # ---------- Windows ----------
      - name: Windows – restic und Inno Setup installieren
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install restic innosetup -y
          # Echtes restic.exe laden (der choco-Shim zeigt auf einen Pfad, den es beim Nutzer nicht gibt)
          gh release download --repo restic/restic --pattern '*_windows_amd64.zip' --dir restic-dl
          Expand-Archive restic-dl\*.zip -DestinationPath restic-dl\x
          Copy-Item (Get-ChildItem restic-dl\x -Filter *.exe | Select-Object -First 1).FullName packaging\windows\restic.exe
          if ((Get-Item packaging\windows\restic.exe).Length -lt 5MB) { throw "restic.exe zu klein - Shim statt Binary?" }
          & packaging\windows\restic.exe version
        env:
          GH_TOKEN: ${{ github.token }}

      - run: cargo test --release
      - run: cargo build --release

      - name: Linux – .deb und AppImage
        if: runner.os == 'Linux'
        run: |
          cargo deb --no-build
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp packaging/icon.png restic-backup-app.png
          ARCH=x86_64 ./linuxdeploy --appdir AppDir \
            -e target/release/restic-backup-app \
            -d packaging/linux/restic-backup-app.desktop \
            -i restic-backup-app.png --output appimage
          mv restic*.AppImage dist/restic-backup-app-${{ steps.ver.outputs.version }}-x86_64.AppImage

      - name: Windows – Setup bauen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\windows\setup.iss
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\installer\*.exe dist\
          Copy-Item target\release\restic-backup-app.exe dist\restic-backup-app-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: restic-backup-app-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          # PR-Pakete braucht der Release nie: kurz halten
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 90 }}

  # Pakete älterer main-Builds löschen: nur der Build des aktuellen main-Commits wird
  # veröffentlicht, ältere Stände belegen sonst bis zu 90 Tage Actions-Speicher
  aufraeumen:
    name: Alte Pakete löschen
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Artefakte älterer main-Builds löschen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == \"main\") | select(.workflow_run.id != $GITHUB_RUN_ID) | .id")
          n=0
          for id in $ids; do
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; then n=$((n + 1)); else echo "::warning::Artefakt $id nicht löschbar"; fi
          done
          echo "Gelöschte Artefakte älterer main-Builds: $n" >> "$GITHUB_STEP_SUMMARY"

  # Stabiler Name: main verlangt genau diese Prüfung (wie bei den anderen Projekten)
  pruefen:
    name: Anwendung prüfen
    if: always()
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Alle Builds verlangen
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "Build (Linux und Windows): $BUILD_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Nächster Schritt bei Erfolg und erhöhter Version: Actions → release → Run workflow (Commit: $GITHUB_SHA)." >> "$GITHUB_STEP_SUMMARY"
          test "$BUILD_RESULT" = success
